[build-system]
requires = ["setuptools>=61.0",
            "async-generator",
            "attrs",
            "beautifulsoup4",
            "bs4",
            "certifi",
            "cffi",
            "charset-normalizer",
            "cryptography",
            "h11",
            "idna",
            "lxml",
            "outcome",
            "Pillow",
            "pycparser",
            "pyOpenSSL",
            "python-dotenv",
            "regex",
            "requests",
            "selenium",
            "six",
            "sniffio",
            "sortedcontainers",
            "soupsieve",
            "trio",
            "trio-websocket",
            "urllib3",
            "wsproto",
            "ruamel_yaml"]
            
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin_sports_noamst"
version = "0.0.1"
authors = [
  { name="Noam", email="noamstanislawski@gmail.com" },
]
description = "Scrapes popular streaming sites and compiles m3u/xml files for viewing, based on jellyfin_sports"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/NoamStanis/jellyfin_sports"
Issues = "https://github.com/NoamStanis/jellyfin_sports/issues"